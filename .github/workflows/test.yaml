name: build & test

on:
    push:
        # branches: ["main"]

    pull_request:
        branches: ["main"]

    workflow_dispatch:

jobs:
    angular_build:
        name: Angular App Node ${{ matrix.node-version }} build
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [24.x, 26.x]

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Install Packages
              run: |
                  cd ./frontend
                  bun install --frozen-lockfile

            - name: Build Angular App
              run: |
                  cd ./frontend
                  pwd
                  bun run build

    python_check:
        name: Python Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: 3.13

            - name: Install the latest version of uv
              uses: astral-sh/setup-uv@v7

            - name: Install Python dependencies
              run: |
                  cd ./backend
                  uv sync --frozen

            - name: Ruff check
              run: |
                  uvx ruff check
