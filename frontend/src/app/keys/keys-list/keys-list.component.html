@if (keys.pending()) {
  <p>Loading keys...</p>
} @else if (keys.error()) {
  <p class="t-error">Error loading keys: {{ keys.error() }}</p>
} @else {
  <div class="p-3">
    <table class="table">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Chiave</th>
        </tr>
      </thead>
      <tbody>
        @for (k of keys.list(); track $index) {
          <tr [routerLink]="['/keys', k]">
            <th scope="row">{{ $index + 1 }}</th>
            <td>{{ k }}</td>
          </tr>
        } @empty {
          <tr class="t-center t-xl t-warn">
            <td [colSpan]="2">No keys found</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
