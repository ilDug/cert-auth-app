<h2 class="t-main px-5 mt-3">New Certificate</h2>

<form novalidate (submit)="addCertificate($event)">
  <mat-dialog-content class="px-5">
    <div class="field">
      <label for="subject">FQDN</label>
      <input type="text" id="subject" placeholder="common name" [formField]="form.subject" />
      @if (form.subject().errors().length > 0 && form.subject().touched) {
        <div class="error">
          {{ form.subject().errors()[0].message }}
        </div>
      }
    </div>

    <div class="field">
      <label for="days">Validity [days]</label>
      <input
        type="number"
        id="days"
        placeholder="expiration [days, min 2]"
        [formField]="form.days"
      />
      @if (form.days().errors().length > 0 && form.days().touched) {
        <div class="error">
          {{ form.days().errors()[0].message }}
        </div>
      }
    </div>

    <div class="field">
      <mat-checkbox color="secondary" [formField]="form.wildcard">Wildcard</mat-checkbox>
    </div>
  </mat-dialog-content>

  <div class="p-5 justify-end flex g-3">
    <a class="btn" [mat-dialog-close]>
      <i class="fa-light fa-times me-1" mat-dialog-close></i>
      Cancel
    </a>
    <button class="btn btn-main" type="submit" [disabled]="form().invalid()">
      <i class="fa-light fa-save me-1"></i>
      Add
    </button>
  </div>
</form>
